<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Packet Sniffer — ML Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="dashboard-container">

    <!-- Header -->
    <header>
        <div class="header-left">
            <h1>🌐 Network Packet Sniffer</h1>
            <span class="subtitle">Real-time ML Traffic Analysis</span>
        </div>
        <div class="stats-panel">
            <div class="stat-box">
                <span class="stat-label">Total Packets</span>
                <span class="stat-value" id="total-packets">0</span>
            </div>
            <div class="stat-box stat-normal">
                <span class="stat-label">✅ Normal</span>
                <span class="stat-value" id="normal-count">0</span>
            </div>
            <div class="stat-box stat-suspicious">
                <span class="stat-label">🚨 Suspicious</span>
                <span class="stat-value" id="suspicious-count">0</span>
            </div>
        </div>
    </header>

    <!-- Controls -->
    <div class="controls-panel">
        <button id="btn-start"  class="btn btn-success">▶ Start Capture</button>
        <button id="btn-stop"   class="btn btn-danger"  disabled>⏹ Stop Capture</button>
        <button id="btn-clear"  class="btn btn-warning">🗑 Clear Data</button>
        <button id="btn-export" class="btn btn-primary">⬇ Export CSV</button>
        <span id="status-msg" class="status-msg">Idle</span>
        <span id="mode-badge" class="mode-badge"></span>
    </div>

    <!-- Filters -->
    <div class="filters-panel">
        <label for="filter-protocol">Protocol:</label>
        <select id="filter-protocol">
            <option value="ALL">All</option>
            <option value="TCP">TCP</option>
            <option value="UDP">UDP</option>
            <option value="ICMP">ICMP</option>
        </select>

        <label for="filter-ip">IP Address:</label>
        <input type="text" id="filter-ip" placeholder="Search by IP…">

        <label for="filter-prediction">Prediction:</label>
        <select id="filter-prediction">
            <option value="ALL">All</option>
            <option value="Normal">Normal</option>
            <option value="Suspicious">Suspicious</option>
        </select>

        <button id="btn-apply-filter" class="btn btn-secondary">🔍 Apply Filter</button>
    </div>

    <!-- Main Grid -->
    <div class="main-content">
        <!-- Packet Table -->
        <div class="table-container" id="table-scroll">
            <table id="packets-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Source IP</th>
                        <th>Destination IP</th>
                        <th>Protocol</th>
                        <th>Size (B)</th>
                        <th>Prediction</th>
                    </tr>
                </thead>
                <tbody id="packets-tbody"></tbody>
            </table>
        </div>

        <!-- Charts Column -->
        <div class="charts-column">
            <div class="chart-card">
                <h3>Protocol Distribution</h3>
                <canvas id="protocolChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Threat Ratio</h3>
                <canvas id="threatChart"></canvas>
            </div>
        </div>
    </div>

</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
